# Exercises every algorithm and every ref form, so a refactor that changes
# any emitted byte fails loudly. Regenerate the goldens deliberately:
#   pnpm build && node test/fixtures/regenerate.mjs
dtg: 1

modes: [light, dark]

changelog:
  - 2026-08-21: fixture for the golden-output test
  - 2026-08-21: wide-gamut anchors, so the @supports layer is covered

defaults:
  scale:
    toward: ["#fafdff", "#001a28"]
    hueShift: 15
    midpoint: 0.4

palette:
  paper: "#ffffff"
  ink:
    body: "#313133"
    muted: "#828282"

  vivid: "color(display-p3 1 0 0)"
  lush: "oklch(0.72 0.28 145)"

systems:
  sky:
    algorithm: tint
    alias: light
    params: { base: "#fafdff", tint: "#001a28" }

  night:
    algorithm: tint
    params: { base: "#151c1f", tint: "#fafdff" }

  # A wash: tints that share a ground, one per color.
  warm-wash:
    description: Two tints over paper.
    red:
      description: The warm one.
      algorithm: tint
      params: { base: paper, tint: "#b30a0a" }
    blue:
      algorithm: tint
      params: { base: paper, tint: "#6192bb" }

  theme:
    algorithm: scale
    params: { base: "#03a2e8" }
    emit: [50, 500, 950]

  shadow:
    algorithm: overlay
    params: { color: "#000000" }

  wide:
    algorithm: tint
    params: { base: "#ffffff", tint: "color(display-p3 1 0 0)" }

  widemix:
    algorithm: tint
    params: { base: "#ffffff", tint: "color(display-p3 0 0.4 1)" }

  grouped:
    alias: { css: renamed, figma: Renamed }
    inner:
      algorithm: tint
      params: { base: "#ffffff", tint: "#ff0000" }

roles:
  surface:
    canvas: [sky(3), night(4)]
    tint: [warm-wash.red(6), warm-wash.blue(6)]
    full: [warm-wash.red(100), warm-wash.blue(100)]
    scale: [theme(50), theme(950)]
    nested: [grouped.inner(10), grouped.inner(20)]
    echo: [surface.canvas, surface.canvas]
    wide: [wide(60), widemix(80)]
    lush: [lush, vivid]

  label:
    primary:
      omit: true
      refs: [ink.body, paper]
    muted: [ink.muted, ink.muted]
    aliased:
      alias: { css: renamed-label }
      refs: [paper, ink.body]

  state:
    veil: [sky(3 tint), night(4 tint)]
    deferred: [warm-wash.red(6 tint), warm-wash.blue(6 tint)]
    scrim: [shadow(40), shadow(60)]
    faded: [transparent(paper 70), transparent(ink.body 40)]
    widefade: [transparent(vivid 30), transparent(paper 30)]
