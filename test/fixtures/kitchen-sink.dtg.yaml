# Exercises every algorithm and every ref form, so a refactor that changes
# any emitted byte fails loudly. Regenerate the goldens deliberately:
#   pnpm build && node test/fixtures/regenerate.mjs
dtg: 1

modes: [light, dark]

changelog:
  - 2026-08-21: fixture for the golden-output test

defaults:
  oklch-scale:
    toward: ["#fafdff", "#001a28"]
    hueShift: 15
    stops: { "50": 0.05, "500": 1, "950": 0.05 }

systems:
  paper: "#ffffff"
  ink:
    body: "#313133"
    muted: "#828282"

  sky:
    algorithm: ink-ramp
    alias: light
    params: { base: "#fafdff", ink: "#001a28" }

  night:
    algorithm: ink-ramp
    params: { base: "#151c1f", ink: "#fafdff" }

  warm:
    algorithm: blend
    params:
      base: "#ffffff"
      toward: { red: "#b30a0a", blue: "#6192bb" }

  perceptual:
    algorithm: blend
    params:
      space: oklab
      base: "#ffffff"
      toward: { red: "#b30a0a" }

  lightmix:
    algorithm: blend
    params:
      space: srgb-linear
      base: "#ffffff"
      toward: { red: "#b30a0a" }

  theme:
    algorithm: oklch-scale
    params: { base: "#03a2e8" }

  shadow:
    algorithm: overlay
    params: { color: "#000000" }

  grouped:
    alias: { css: renamed, figma: Renamed }
    inner:
      algorithm: ink-ramp
      params: { base: "#ffffff", ink: "#ff0000" }

roles:
  surface:
    canvas: [sky/3, night/4]
    tint: [warm/red@6, warm/blue@6]
    full: [warm/red@100, warm/blue@100]
    perceptual: [perceptual/red@6, lightmix/red@6]
    scale: [theme/50, theme/950]
    nested: [grouped.inner/10, grouped.inner/20]
    echo: [surface.canvas, surface.canvas]

  label:
    primary:
      omit: true
      refs: [ink.body, paper]
    muted: [ink.muted, ink.muted]
    aliased:
      alias: { css: renamed-label }
      refs: [paper, ink.body]

  state:
    veil: [sky/3/ink, night/4/ink]
    deferred: [warm/red@6/alpha, warm/blue@6/alpha]
    scrim: [shadow/40, shadow/60]
    faded: [transparent(paper 70), transparent(ink.body 40)]
